<style>
/* Layout: printed-poster feel. White paper, the pixel archer as the recurring stamp, one cobalt band that flips the logo to white */
:root{
  --paper:#FFFFFF; --ink:#0E0F1A; --muted:#5E6274; --tint:#F2F4FF;
  --cobalt:#1F45F5; --peri:#A4B0FF; --red:#EE4436; --orange:#F6A12E; --gold:#F2D15C;
  --display:"Instrument Serif","Times New Roman",serif;
  --body:"Instrument Sans",ui-sans-serif,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.wrap{max-width:1240px;margin:0 auto;padding-inline:clamp(16px,4vw,48px)}
a{color:inherit}
:focus-visible{outline:3px solid var(--cobalt);outline-offset:3px;border-radius:4px}
svg.archer{display:block;width:100%;height:auto}

nav .wrap{display:flex;align-items:center;justify-content:space-between;padding-block:22px;gap:16px}
.mark{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--display);font-size:30px;line-height:1}
.mark svg{width:30px;color:var(--cobalt)}
.links{display:flex;gap:30px;font-size:15px;color:var(--muted)}
.links a{text-decoration:none}.links a:hover{color:var(--cobalt)}
.pill{background:var(--cobalt);color:#fff;padding:10px 20px;border-radius:999px;font-weight:600;font-size:14px;text-decoration:none;transition:transform .2s}
.pill:hover{transform:translateY(-2px)}

.hero{padding-top:clamp(20px,4vw,48px);overflow:hidden}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(88px,17vw,250px);line-height:.82;letter-spacing:-.035em;margin:0}
.hero-top{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;flex-wrap:wrap}
.hero-top p{max-width:30ch;margin:0 0 18px;font-size:clamp(17px,1.5vw,20px);color:var(--muted)}
.hero-top p em{font-family:var(--display);font-size:1.35em;color:var(--ink)}
.parade{position:relative;height:clamp(220px,34vw,470px);margin-top:clamp(16px,3vw,40px);cursor:ew-resize}
.parade svg{position:absolute;bottom:-14%;left:0;width:clamp(170px,26vw,370px);transition:transform 1.3s cubic-bezier(.16,1,.3,1);mix-blend-mode:multiply}

.strip{background:var(--tint);padding-block:26px;overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.track{list-style:none;margin:0;padding:0;display:flex;gap:clamp(36px,4vw,64px);width:max-content;animation:slide 30s linear infinite}
.strip:hover .track{animation-play-state:paused}
.track li{display:flex;align-items:center;gap:12px;font-family:var(--display);font-size:clamp(28px,3vw,42px);line-height:1;white-space:nowrap}
.track li svg{width:28px;height:28px;color:var(--cobalt)}
.track li:nth-child(6n+2) svg{color:var(--red)}.track li:nth-child(6n+3) svg{color:var(--orange)}.track li:nth-child(6n+5) svg{color:var(--peri)}
@keyframes slide{to{transform:translateX(-50%)}}
.icons{display:flex;gap:18px;align-items:center;justify-content:center;height:100%;width:100%}
.icons svg{width:clamp(44px,5vw,64px);height:clamp(44px,5vw,64px);transition:transform .6s cubic-bezier(.16,1,.3,1)}
.make article:hover .icons svg{transform:translateY(-6px)}
.make article:hover .icons svg:nth-child(2){transition-delay:.06s}.make article:hover .icons svg:nth-child(3){transition-delay:.12s}

section{padding-block:clamp(72px,10vw,140px)}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h2{font-family:var(--display);font-weight:400;font-size:clamp(44px,6vw,88px);line-height:.95;letter-spacing:-.025em;margin:14px 0 22px;text-wrap:balance;max-width:14ch}
h2 em{color:var(--cobalt)}
.sub{color:var(--muted);max-width:50ch;font-size:19px;margin:0}

.make{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(20px,3vw,44px);margin-top:64px}
.make article{display:flex;flex-direction:column;gap:14px;min-width:0}
.swatch{aspect-ratio:4/3;border-radius:6px;overflow:hidden;position:relative;display:flex;align-items:flex-end;justify-content:center}
.swatch svg{width:62%;transition:transform .7s cubic-bezier(.16,1,.3,1);transform:translateY(10%)}
.make article:hover .swatch svg{transform:translateY(2%) scale(1.04)}
.make h3{font-family:var(--display);font-weight:400;font-size:34px;margin:6px 0 0;line-height:1}
.make p{margin:0;color:var(--muted)}

.band{background:var(--cobalt);color:#fff;overflow:hidden}
.band .wrap{display:grid;grid-template-columns:1.1fr 1fr;align-items:center;gap:32px;padding-block:0}
.band .fig{color:#fff;align-self:end;margin-left:clamp(-48px,-4vw,-16px)}
.band .fig svg{transform:translateY(6%)}
.band h2{color:#fff;font-size:clamp(56px,8vw,120px);max-width:none;margin:0 0 20px}
.band p{color:rgba(255,255,255,.78);font-size:19px;max-width:38ch;margin:0}
.band .copy{padding-block:clamp(56px,8vw,110px);min-width:0}

.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(20px,3vw,40px);margin-top:64px}
.step{min-width:0}
.step .when{font-family:var(--mono);font-size:12px;color:var(--muted)}
.step .bar{height:6px;border-radius:6px;margin:12px 0 18px}
.step h3{font-family:var(--display);font-weight:400;font-size:34px;margin:0 0 6px;line-height:1}
.step p{margin:0;color:var(--muted);font-size:16px}

.end{text-align:center}
.end h2{margin-inline:auto;font-size:clamp(60px,10vw,150px);max-width:11ch}
.end .sub{margin-inline:auto}
.end .pill{display:inline-block;margin-top:34px;padding:16px 30px;font-size:16px}
.end .duo{display:flex;justify-content:center;gap:0;margin-top:clamp(40px,6vw,80px)}
.end .duo svg{width:clamp(140px,22vw,300px);margin-inline:-4%}
.end .duo svg:first-child{transform:scaleX(-1)}

footer{background:var(--ink);color:rgba(255,255,255,.65);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;padding-block:28px}
footer b{font-family:var(--display);font-weight:400;font-size:22px;color:#fff}

@media (max-width:900px){
  .make,.steps{grid-template-columns:1fr 1fr}
  .band .wrap{grid-template-columns:1fr}
  .band .fig{order:2;max-width:420px}
  .links{display:none}
}
@media (max-width:560px){.make,.steps{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
html,body{height:100%}
body{overflow:hidden}
.hero{height:100svh;display:flex;flex-direction:column;padding-top:clamp(28px,6vh,72px)}
.hero>.wrap{flex:1;display:flex;flex-direction:column;width:100%;min-height:0}
.parade{flex:1;height:auto;min-height:0;margin-top:clamp(12px,3vh,40px)}
.parade svg{bottom:-8%;width:min(30vw,78vh,440px)}
@media (max-width:700px){.parade svg{width:min(42vw,52vh)}.hero-top p{margin-bottom:0}}
#word{display:flex;cursor:default;user-select:none}
#word .l{display:inline-block}
.aim{position:relative;display:inline-block;cursor:crosshair}
.aim svg{position:absolute;left:0;right:0;bottom:-.08em;width:100%;height:.28em;overflow:visible;fill:none;stroke:var(--cobalt);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.aim svg path{vector-effect:non-scaling-stroke}
.aim .shaft{stroke-dasharray:200;stroke-dashoffset:200}
.aim .head,.aim .fl{opacity:0}
.aim.fly .shaft{animation:draw .7s cubic-bezier(.6,0,.2,1) forwards}
.aim.fly .head{animation:headin .7s cubic-bezier(.6,0,.2,1) forwards}
.aim.fly .fl{animation:flin .3s .55s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes headin{0%{opacity:1;transform:translateX(-180px)}100%{opacity:1;transform:none}}
@keyframes flin{to{opacity:1}}
.shot{position:absolute;height:2px;background:var(--cobalt);border-radius:2px;pointer-events:none;transform-origin:left center}
.shot::after{content:"";position:absolute;right:-2px;top:-5px;border-left:12px solid var(--cobalt);border-top:6px solid transparent;border-bottom:6px solid transparent}
.parade{cursor:crosshair}
@media (prefers-reduced-motion:reduce){.aim .shaft{stroke-dashoffset:0}.aim .head,.aim .fl{opacity:1}}
</style>

      <svg class="archer" style="color:var(--peri)"   viewBox="0 0 1610 1890"><use href="#apollo"/></svg>
      <svg class="archer" style="color:var(--cobalt)" viewBox="0 0 1610 1890"><use href="#apollo"/></svg>
    </div>
  </div>
</header>

<script>
(()=>{
  const p=document.getElementById('parade'),figs=[...p.querySelectorAll('svg')];
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let spread=0;
  function lay(s){
    const w=p.clientWidth,f=figs[0].clientWidth,step=Math.max(0,(w-f)/(figs.length-1))*s;
    figs.forEach((el,i)=>el.style.transform=`translateX(${step*i}px)`);
  }
  // fan out from a single stacked archer on load
  lay(0);
  requestAnimationFrame(()=>setTimeout(()=>{spread=1;lay(1)},reduce?0:250));
  p.addEventListener('pointermove',e=>{const b=p.getBoundingClientRect();spread=.55+.45*((e.clientX-b.left)/b.width);figs.forEach(f=>f.style.transitionDuration='.6s');lay(spread)});
  p.addEventListener('pointerleave',()=>{spread=1;lay(1)});
  addEventListener('resize',()=>lay(spread));
})();

// Chromatic echo: letters throw off the parade colors away from the cursor
(()=>{
  const w=document.getElementById('word'),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cols=['#1F45F5','#A4B0FF','#EE4436','#F6A12E','#F2D15C'];
  w.innerHTML=[...w.textContent].map((c,i)=>`<span class="l" aria-hidden="true" >${c}</span>`).join('');
  if(!reduce)[...w.children].forEach((el,i)=>el.animate([{opacity:0,transform:'translateY(.35em) rotate(4deg)',filter:'blur(8px)'},{opacity:1,transform:'none',filter:'blur(0)'}],{duration:900,delay:80+i*70,easing:'cubic-bezier(.16,1,.3,1)',fill:'backwards'}));
  const L=[...w.children].map(el=>({el,x:0,y:0,tx:0,ty:0}));
  let px=-1e4,py=-1e4,running=false;
  const tick=()=>{
    let moving=false;
    L.forEach(o=>{
      const r=o.el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
      const dx=cx-px,dy=cy-py,dist=Math.hypot(dx,dy),R=r.height*1.6;
      const f=Math.max(0,1-dist/R),k=r.height*.05*f;
      o.tx=dist?dx/dist*k:0;o.ty=dist?dy/dist*k:0;
      o.x+=(o.tx-o.x)*.18;o.y+=(o.ty-o.y)*.18;
      if(Math.abs(o.x)>.05||Math.abs(o.y)>.05||f>0)moving=true;
      o.el.style.textShadow=Math.abs(o.x)+Math.abs(o.y)<.05?'none':cols.map((c,i)=>`${(o.x*(i+1)).toFixed(1)}px ${(o.y*(i+1)).toFixed(1)}px 0 ${c}`).reverse().join(',');
    });
    running=moving;if(moving)requestAnimationFrame(tick);
  };
  const go=()=>{if(!running&&!reduce){running=true;requestAnimationFrame(tick)}};
  addEventListener('pointermove',e=>{px=e.clientX;py=e.clientY;go()});
  document.addEventListener('pointerleave',()=>{px=py=-1e4;go()});
  L.forEach(o=>o.el.addEventListener('pointerenter',()=>{if(!reduce)o.el.animate([{transform:'none'},{transform:'translateX(.06em) rotate(-5deg) scaleY(.92)',offset:.25},{transform:'none'}],{duration:550,easing:'cubic-bezier(.2,.9,.3,1.4)',composite:'add'})}));
  w.addEventListener('pointerdown',e=>{px=e.clientX;py=e.clientY;go();setTimeout(()=>{px=py=-1e4;go()},500)});

  // Arrow under "aimed true." draws in, re-fires on hover
  const a=document.getElementById('aim');
  const fire=()=>{a.classList.remove('fly');void a.offsetWidth;a.classList.add('fly')};
  setTimeout(fire,reduce?0:900);a.addEventListener('pointerenter',fire);a.addEventListener('click',fire);

  // Click the archers to loose an arrow toward the click
  const p=document.getElementById('parade'),archers=[...p.querySelectorAll('svg')],lead=archers[archers.length-1];
  p.addEventListener('click',e=>{
    if(reduce)return;
    const pr=p.getBoundingClientRect(),lr=lead.getBoundingClientRect();
    const sx=lr.right-pr.left-lr.width*.04,sy=lr.top-pr.top+lr.height*.47;
    const tx=e.clientX-pr.left,ty=e.clientY-pr.top;
    const ang=Math.atan2(ty-sy,Math.max(40,tx-sx)),len=Math.hypot(innerWidth,innerHeight);
    const s=document.createElement('div');s.className='shot';
    s.style.cssText=`left:${sx}px;top:${sy}px;width:${Math.min(90,lr.width*.3)}px;transform:rotate(${ang}rad)`;
    p.appendChild(s);
    s.animate([{transform:`rotate(${ang}rad) translateX(0)`,opacity:1},{transform:`rotate(${ang}rad) translateX(${len}px)`,opacity:1}],{duration:700,easing:'cubic-bezier(.3,.6,.2,1)'}).onfinish=()=>s.remove();
    archers.forEach((f,i)=>f.animate([{translate:'0 0'},{translate:`${-6-i*2}px 0`},{translate:'0 0'}],{duration:420,delay:(archers.length-1-i)*40,easing:'ease-out'}));
  });
})();
</script>

</body>
